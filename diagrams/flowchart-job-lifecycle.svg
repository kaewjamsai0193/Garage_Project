<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1060" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-flow-title job-flow-desc">
      <title id="job-flow-title">วงจรใบงานซ่อมของอู่</title>
      <desc id="job-flow-desc">ผังการตัดสินใจตั้งแต่รับรถและเปิดใบงาน ออกใบเสนอราคาให้ลูกค้าอนุมัติ ตรวจว่าสต็อกพอหรือไม่ ถ้าไม่พอจะตัดเท่าที่มีแล้วตั้งสถานะรออะไหล่พร้อมเปิดจัดซื้อ ถ้าพอจะตัดสต็อกแบบ FIFO และซ่อม หากงานบานปลายจะวนกลับไปออกใบเสนอราคาเวอร์ชันใหม่ ก่อนออกบิลแยกภาษีและปิดงานพร้อมตั้งแจ้งเตือนรอบบำรุงรักษา</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;family=Noto+Serif+Thai:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS -->
      <line x1="340" y1="120" x2="340" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="340" y1="224" x2="340" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="436" y1="300" x2="736" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="548" y="280" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="586" y="289" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REJECTED</text>

      <line x1="340" y1="344" x2="340" y2="396" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="352" y="372" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="381" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">APPROVED</text>

      <line x1="436" y1="440" x2="720" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="544" y="420" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="578" y="429" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHORT</text>

      <path d="M 840,412 V 372 Q 840,364 832,364 H 348 a 8,8 0 0,0 -16,0 H 208 Q 200,364 200,372 V 432 Q 200,440 208,440 H 240" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="592" y="344" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="353" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARTS ARRIVED</text>

      <line x1="340" y1="484" x2="340" y2="536" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="352" y="496" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="505" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">IN STOCK</text>

      <line x1="340" y1="592" x2="340" y2="636" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 436,680 H 1072 Q 1080,680 1080,672 V 204 Q 1080,196 1072,196 H 464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="964" y="556" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1016" y="565" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVISION v2</text>

      <line x1="340" y1="724" x2="340" y2="776" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="352" y="736" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="745" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NO CHANGE</text>

      <line x1="340" y1="832" x2="340" y2="880" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- NODES -->
      <!-- N1 start -->
      <rect x="204" y="64" width="272" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="204" y="64" width="272" height="56" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="340" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">รับรถเข้าอู่ + เปิดใบงาน JOB</text>

      <!-- N2 quotation -->
      <rect x="220" y="168" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="168" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ออกใบเสนอราคา v(n)</text>
      <text x="340" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">snapshot selling price</text>

      <!-- N3 decision approve (FOCAL) -->
      <polygon points="340,256 436,300 340,344 244,300" fill="#f5f5f5"/>
      <polygon points="340,256 436,300 340,344 244,300" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="340" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ลูกค้าอนุมัติ?</text>

      <!-- N4 cancel end -->
      <rect x="736" y="272" width="208" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="736" y="272" width="208" height="56" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="840" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ยกเลิก / ปิดใบงาน</text>

      <!-- N5 decision stock -->
      <polygon points="340,396 436,440 340,484 244,440" fill="#f5f5f5"/>
      <polygon points="340,396 436,440 340,484 244,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">สต็อกพอตัดไหม?</text>

      <!-- N6 rollback + procurement -->
      <rect x="720" y="412" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="412" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="840" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ตัดเท่าที่มี → รออะไหล่</text>
      <text x="840" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">open po · direct receive</text>

      <!-- N7 fifo + repair -->
      <rect x="220" y="536" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="536" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="560" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ตัดสต็อก FIFO + ช่างซ่อม</text>
      <text x="340" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consume lots · lock actual cost</text>

      <!-- N8 decision scope creep -->
      <polygon points="340,636 436,680 340,724 244,680" fill="#f5f5f5"/>
      <polygon points="340,636 436,680 340,724 244,680" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="684" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">งานบานปลาย?</text>

      <!-- N9 billing -->
      <rect x="220" y="776" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="776" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="800" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">หักโปรโมชั่น + ออกบิล</text>
      <text x="340" y="816" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vat 7% parts · wht 3% labor</text>

      <!-- N10 end (FOCAL) -->
      <rect x="204" y="880" width="272" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="204" y="880" width="272" height="56" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="340" y="904" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif" text-anchor="middle">ปิดงาน + ส่งมอบรถ</text>
      <text x="340" y="920" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gross profit · maintenance alert</text>

      <!-- LEGEND -->
      <line x1="200" y1="976" x2="1080" y2="976" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="200" y="996" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="300" y="988" width="20" height="10" rx="5" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="328" y="996" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">START / END</text>

      <rect x="464" y="988" width="20" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="492" y="996" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STEP</text>

      <polygon points="580,988 592,993 580,998 568,993" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="600" y="996" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DECISION</text>

      <line x1="716" y1="993" x2="740" y2="993" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="748" y="996" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">WAITING PART</text>

      <line x1="912" y1="993" x2="936" y2="993" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="944" y="996" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HAPPY PATH</text>
    </svg>
